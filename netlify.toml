[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.19.0"
  IMAGE_CONCURRENCY = "2"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/images/*"

  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
